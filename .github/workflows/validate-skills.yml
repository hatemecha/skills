name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog and installation rules
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_skills.py
          python scripts/install_agent_rules.py --help > /dev/null
          python scripts/install_agent_rules.py --print-cursor > /dev/null
      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            agentskills validate "$skill"
          done
