name: Validate skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "template/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "LICENSE"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "template/**"
      - "tests/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "LICENSE"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository contract
        run: python scripts/validate_skills.py

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            agentskills validate "$skill"
          done

      - name: Verify multi-agent skill discovery
        run: python scripts/check_discovery.py
